<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/>
      <stop offset="0.55" stop-color="#1a0b2e"/>
      <stop offset="1" stop-color="#0a1a0f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b86bff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5dff7a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#d49a1a"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b2ff7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <circle cx="160" cy="60" r="260" fill="url(#glowP)"/>
  <circle cx="1060" cy="320" r="280" fill="url(#glowG)"/>

  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 40H1200M0 120H1200M0 200H1200M0 280H1200"/>
    <path d="M100 0V360M300 0V360M500 0V360M700 0V360M900 0V360M1100 0V360"/>
  </g>

  <rect x="20" y="20" width="1160" height="320" rx="18" fill="none" stroke="url(#title)" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Coroa -->
  <g transform="translate(600 62)">
    <polygon points="-48,38 -48,-8 -24,14 0,-22 24,14 48,-8 48,38" fill="url(#gold)" stroke="#fff2b0" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="-48" y="38" width="96" height="9" rx="3" fill="#b9800f"/>
    <circle cx="-48" cy="-10" r="5" fill="#ffe27a"/>
    <circle cx="0" cy="-24" r="6" fill="#ffe27a"/>
    <circle cx="48" cy="-10" r="5" fill="#ffe27a"/>
  </g>

  <!-- Título -->
  <text x="600" y="198" text-anchor="middle" font-family="'Segoe UI','Arial Black',Arial,Helvetica,sans-serif" font-size="82" font-weight="900" letter-spacing="10" fill="#7b2ff7" opacity="0.6" filter="url(#soft)">KATRIELLY BOT</text>
  <text x="600" y="198" text-anchor="middle" font-family="'Segoe UI','Arial Black',Arial,Helvetica,sans-serif" font-size="82" font-weight="900" letter-spacing="10" fill="url(#title)">KATRIELLY BOT</text>

  <!-- Divisor -->
  <path d="M340 226H560M640 226H860" stroke="url(#title)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="600,218 608,226 600,234 592,226" fill="#ffe27a"/>

  <!-- Slogan -->
  <text x="600" y="274" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="27" letter-spacing="4" fill="#d8d8e0">PODER ABSOLUTO. ESTILO INCONFUNDÍVEL.</text>

  <!-- Assinatura -->
  <text x="600" y="316" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" letter-spacing="6" fill="#9a9aa8">BY DOCTOR VALEYARD</text>
</svg>
